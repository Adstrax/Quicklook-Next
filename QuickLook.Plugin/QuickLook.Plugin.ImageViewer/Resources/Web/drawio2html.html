<!DOCTYPE html>
<html lang="en" data-quicklook-failures="1">
<head>
  <meta charset="UTF-8" />
  <title>Draw.io Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #fff;
    }
    #graph-container {
      width: 100%; height: 100%;
    }
    /* Hide the diagrams.net toolbar for a clean preview */
    .geDiagramContainer { border: none !important; }
  </style>
</head>
<body>
  <div id="graph-container"></div>

  <script src="/js/viewer-static.min.js"></script>
  <script>
    'use strict';

    var _pendingXml = null;
    var _viewerReady = false;

    function doRender(xml) {
      var container = document.getElementById('graph-container');
      container.innerHTML = '';

      var div = document.createElement('div');
      div.className = 'mxgraph';
      div.setAttribute('style', 'max-width:100%;border:1px solid transparent;');
      div.setAttribute('data-mxgraph', JSON.stringify({
        xml: xml,
        nav: true,
        toolbar: null,
        fit: 1,
        page: 1,
        resize: true
      }));
      container.appendChild(div);

      try {
        if (window.GraphViewer && window.GraphViewer.processElements) {
          window.GraphViewer.processElements();
        }
      } catch (error) {
        showRenderFailure(error);
      }
    }

    function showRenderFailure(error) {
      if (document.getElementById('__quicklook_drawio_error'))
        return;

      var message = document.createElement('div');
      message.id = '__quicklook_drawio_error';
      message.textContent = 'This diagram could not be rendered.' +
        (error && error.message ? '\n' + error.message : '');
      message.style.cssText =
        'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
        'padding:32px;font:14px/1.6 "Segoe UI",sans-serif;color:#888;text-align:center;' +
        'white-space:pre-wrap;';
      document.body.appendChild(message);
      window.__quicklookPostReady?.();
    }

    window.__DRAWIO_RENDER = function(xml) {
      if (_viewerReady) {
        doRender(xml);
      } else {
        _pendingXml = xml;
      }
    };

    // Wait for GraphViewer to be available, then process any pending render
    (function waitForViewer() {
      if (window.GraphViewer) {
        _viewerReady = true;
        if (_pendingXml !== null) {
          doRender(_pendingXml);
          _pendingXml = null;
        }
      } else {
        setTimeout(waitForViewer, 20);
      }
    })();
  </script>
</body>
</html>
