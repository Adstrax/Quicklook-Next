name: build

on:
  push:
    # v3.31.0: every branch is built - the release lines (main/lite) and the
    # development branches, which previously were not covered at all.
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build Release
        run: dotnet build QuickLookNext.slnx -c Release --nologo
      - name: Verify runtime footprint
        shell: pwsh
        run: ./Scripts/verify-runtime-footprint.ps1
      # v3.31.0: unit tests for the non-GUI logic (argument parsing, extension
      # filter, settings store, update URL allow list). The harness has no
      # NuGet dependencies, so it runs directly from the build output.
      - name: Unit tests
        shell: pwsh
        run: |
          $exe = 'QuickLook.Tests/bin/Release/net10.0-windows/QuickLook.Tests.exe'
          & $exe
          exit $LASTEXITCODE
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: QuickLookNext-Release
          path: Build/Release
          if-no-files-found: error

  # v3.10.0: the full GUI smoke test runs on every push/PR. QL_SMOKE_CI lets
  # test.ps1 relax the DWM-dependent Acrylic assertion on headless runners.
  # v3.31.0: it stays limited to the release lines on purpose - it drives a real
  # window on a runner, so development branches get the faster build+unit jobs.
  smoke:
    if: github.event_name == 'workflow_dispatch' ||
        github.ref_name == 'main' ||
        github.ref_name == 'lite' ||
        startsWith(github.ref_name, 'opt/') ||
        github.base_ref == 'main' ||
        github.base_ref == 'lite' ||
        startsWith(github.base_ref, 'opt/')
    runs-on: windows-latest
    needs: build
    env:
      QL_SMOKE_CI: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Smoke test
        shell: pwsh
        run: ./test.ps1
